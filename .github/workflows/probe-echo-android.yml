name: Prove the Echo extension on ART

# Loads the released Echo extension with DexClassLoader on a real Android runtime and
# prints what it returns. Same mechanism Convx uses; this proves the mechanism.

on:
  push:
    branches:
      - probe-echo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Load and drive on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the probe APK
        run: ./gradlew -p tools/echo-android-probe assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r tools/echo-android-probe/build/outputs/apk/debug/*.apk
            adb logcat -c
            adb shell am start -n probe.echo/.ProbeActivity
            for i in $(seq 1 40); do
              if adb logcat -d -s PROBE | grep -q "PROBE.*DONE"; then break; fi
              sleep 3
            done
            echo "===== PROBE OUTPUT ====="
            adb logcat -d -s PROBE | sed 's/^.*PROBE *: //'
