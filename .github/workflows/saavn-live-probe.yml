name: JioSaavn API probe

# Manual only. Calls api.php a handful of times and prints the response shapes so the
# extension's parsers can be checked against captured output. Never runs on push.
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search query to probe'
        required: false
        default: 'kesariya'

jobs:
  probe:
    name: Probe api.php shapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Probe live api.php shapes
        env:
          SAAVN_LIVE: "1"
          SAAVN_QUERY: ${{ inputs.query }}
        run: ./gradlew :extension-jiosaavn:test --tests '*SaavnLiveProbeTest*' --console=plain
